<header>
  <a href="{{ site.url }}" class="logo">geordee</a>
  <button type="button" class="menubutton" aria-label="Menu" aria-expanded="false" aria-controls="site-nav">{% include icon.html name="bars" %}</button>
  <nav id="site-nav">
    <ul>
      {% for page in site.pages %}
        {% if page.title %}
          <li><a href="{{ page.url | prepend: site.baseurl }}">{{ page.title }}</a></li>
        {% endif %}
      {% endfor %}
    </ul>

  </nav>
  <br class="clear" />
</header>
