<head>
  <meta charset="utf-8">
  <title>{% if page.title %}{{ site.title }} / {{ page.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% seo title=false %}
  <link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ '/feed.xml' | prepend: site.baseurl | prepend: site.url }}">
  {% if page.collection == "posts" %}
  <link rel="alternate" type="text/markdown" title="{{ page.title }} (markdown)" href="{{ page.url | append: '.md' | prepend: site.baseurl | prepend: site.url }}">
  {% endif %}
  <link rel="alternate" type="text/plain" title="llms.txt" href="{{ '/llms.txt' | prepend: site.baseurl | prepend: site.url }}">

  <link rel="preload" href="/assets/fonts/open-sans-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/assets/stylesheets/application.css?v={{ site.time | date: '%s' }}">

  <link rel="icon" href="/assets/images/favicon.ico" sizes="any">
  <link rel="icon" href="/assets/images/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/assets/images/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#8c7764">
  <meta name="apple-mobile-web-app-title" content="Geordee">

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-E271DR1487"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-E271DR1487');
  </script>
</head>
